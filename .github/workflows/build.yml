name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore viralclip-release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias viralclip \
            -storepass viralclip123 \
            -keypass viralclip123 \
            -dname "CN=ViralClip, OU=Dev, O=ViralClip, L=Unknown, ST=Unknown, C=US"
          echo "KEYSTORE_PATH=${{ github.workspace }}/viralclip-release.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=viralclip123" >> $GITHUB_ENV
          echo "KEY_ALIAS=viralclip" >> $GITHUB_ENV
          echo "KEY_PASSWORD=viralclip123" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViralClip.apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
